# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# -Dfile.encoding=UTF-8：中文 Windows 的 Java 17 默认编码为 GBK，会导致模板引擎(generateModMetadata)
# 读取 UTF-8 模板时乱码；显式指定 UTF-8 后中文注释与 mod 描述才能正确生成
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# maven.neoforged.net 在本网络下极不稳定（SSL 连接频繁被重置）
# 注意：必须以 systemProp. 前缀声明，否则不会注入到 Gradle 守护进程
systemProp.org.gradle.internal.repository.max.retries=20
systemProp.org.gradle.internal.repository.retry.backoff=500
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=60000

# Parchment (更可读的参数名与 Javadoc；版本见 https://parchmentmc.org/docs/getting-started)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# 环境属性（构件坐标：net.minecraftforge:forge:1.20.1-47.x.y，来自 maven.minecraftforge.net）
# 与前置 Keyboard mod 完全同版本（47.4.22），保证两 mod 共存兼容
minecraft_version=1.20.1
minecraft_version_range=[1.20.1, 1.21)
forge_version=47.4.22
forge_version_range=[47.4.22,)
loader_version_range=[47,)

## Mod 属性
mod_id=tower
mod_name=Tower
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.tower
mod_description=Tower: AI 智能体 Mod（客户端）。\n提供感知（方块/实体/射线）、导航（原版寻路 move_to）、视觉（截图）能力；\n转发执行动作给前置 Keyboard mod（本地 WebSocket 24777），对外提供 Tower 协议（24778）。\n零外部依赖（使用 MC 自带 Netty + Gson）。
