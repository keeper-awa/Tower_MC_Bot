// 官方 1.20.1 MDK（ModDevGradle Legacy）精简版 —— 与前置 Keyboard mod 同构：
// - 保留：wrapper、legacyForge 配置、runs（client/server）、生成 mod 元数据、UTF-8
// - 移除：示例物品/方块代码、JEI 注释、gameTestServer/data runs（后续需要时再加）

plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

// 1.20.1 面向 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // 构件坐标：net.neoforged:forge:1.20.1-47.1.106
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called 'modLocalRuntime'
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // 目前零依赖；后续如需 mod 依赖，使用 modCompileOnly / modLocalRuntime 配置
}

// 注：mod 元数据（META-INF/mods.toml、pack.mcmeta）已改为直接存放在 src/main/resources，
// 不再使用模板引擎展开（Groovy SimpleTemplateEngine 对模板内容有解析坑，且单 mod 项目无此必要）。
// 版本号等改动需同时同步 gradle.properties 与 resources/META-INF/mods.toml。

// 发布到本地 repo（默认不发布，供以后需要时使用）
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
